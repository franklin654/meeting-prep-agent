[project]
name = "meeting-prep-agent-backend"
version = "0.1.0"
description = "Meeting Prep Agent backend (FastAPI, Hindsight, SQLite)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "groq>=1.7.0",
    "sqlmodel>=0.0.22",
    "hindsight-client>=0.10.1",
    "openai>=3.20.0",
    "anthropic>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # Anthropic tests import httpx2 directly (anthropic 1.x is built on httpx2, not httpx);
    # previously only a transitive dependency.
    "httpx2>=2.13.1",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: contract tests against a real Hindsight instance",
    "live_llm: one live smoke call per LLM provider; skipped without that provider's key",
    "golden: end-to-end golden scenarios against real Hindsight and the configured LLM providers",
]
asyncio_mode = "auto"
# A plain `pytest` never spends credits or needs services: live, live_llm and golden tests are
# deselected. An explicit `-m live` / `-m live_llm` / `-m golden` comes after addopts and wins.
addopts = "-m 'not live and not live_llm and not golden'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]
