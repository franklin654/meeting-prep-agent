# Meeting Prep Agent — local dev / demo stack.
# One command per AGENTS.md: `docker compose up`.
#
# Services (docs/technical-design.md, "Config, local dev and deployment"):
#   hindsight  -> self-hosted memory service, API :8888, UI :9999
#   api        -> FastAPI backend, :8000                (backend/, built by T01)
#   web        -> Vite dev server, :5173, proxies /api  (frontend/, built by T03)
#
# All env vars come from `.env` (copy `.env.example` -> `.env` and fill in real
# keys; never commit `.env`). Do not put secrets in this file.

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight@sha256:b4d3b76f363aa40cf348450e7f8f52a50653008731b99824b14623a196182e73 # Hindsight 0.10.1 (built 2026-09-21); pinned by digest so :latest cannot change demo behaviour
    ports:
      - "8888:8888" # API
      - "9999:9999" # UI
    environment:
      # Hindsight's own LLM, set separately from the app's (docs/hindsight-integration.md
      # "Setup"). The root .env uses HINDSIGHT_LLM_*; they are mapped here onto the names
      # Hindsight reads. Reflect drives structured tool calls, so the chosen model must
      # support tool calling, whichever provider (openai | groq | anthropic) is selected.
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_LLM_PROVIDER}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_API_KEY}
      # Only applies when Hindsight uses groq; ignored for other providers.
      # Free-tier Groq keys don't have the `auto` service tier Hindsight
      # requests by default, which fails retain's fact extraction with a 400
      # ("service_tier auto is not available for this org"). Override to
      # on_demand per the Hindsight docs (developer/configuration.md).
      HINDSIGHT_API_LLM_GROQ_SERVICE_TIER: ${HINDSIGHT_API_LLM_GROQ_SERVICE_TIER:-on_demand}
      # Stable worker id: a rotating Docker hostname leaves background jobs
      # stuck after a restart, so this must stay fixed across restarts.
      HINDSIGHT_API_WORKER_ID: ${HINDSIGHT_API_WORKER_ID:-hindsight-demo-1}
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    restart: unless-stopped

  api:
    # backend/Dockerfile is owned by T01 (backend scaffold), landing in
    # parallel with this ticket. Build will fail until that lands — expected.
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Reach Hindsight over the compose network, not localhost, regardless
      # of what HINDSIGHT_URL is set to for host-side tooling in .env.
      HINDSIGHT_URL: http://hindsight:8888
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    depends_on:
      - hindsight

  web:
    # frontend/Dockerfile is owned by T03 (frontend scaffold), landing in
    # parallel with this ticket. Build will fail until that lands — expected.
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      # Reach the api service over the compose network, not localhost — the
      # vite dev server's /api proxy target (frontend/vite.config.ts).
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  hindsight-data:
